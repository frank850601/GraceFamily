<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>愛瑰蘭｜空間實景 3D</title><link rel="stylesheet" href="style.css"><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script></head><body>
<header><a class="brand" href="./"><span class="mark">A</span><div>愛瑰蘭 <small>SPACE ARCHIVE / 01</small></div></a><span class="tag"><i></i> 本地互動模型</span><button id="photos">實體照片 ↗</button></header>
<main><aside><div class="eyebrow">RESIDENCE · DIGITAL TWIN</div><h1>走進，<br>生活的空間。</h1><p class="intro">以原始建築模型為基礎，<br>自由探索愛瑰蘭的每個角落。</p><div class="rule"></div><h2>01 / 探索視角</h2><div class="views"><button data-view="home" class="active">↗ 立體總覽</button><button data-view="top">⊞ 平面俯視</button><button data-view="front">▤ 正面視角</button><button data-view="inside">◉ 室內視角</button></div><h2>02 / 顯示設定</h2><label class="switch">自動旋轉<input id="rotate" type="checkbox"></label><label class="switch">線框顯示<input id="wire" type="checkbox"></label><label class="switch">顯示家具<input id="furniture" type="checkbox" checked></label><label class="range-label">水平剖切 <output id="cutValue">2.65 m</output><input id="cut" type="range" min="0.2" max="4.5" step="0.05" value="2.65"></label><p class="note">降低剖切高度，可查看牆後的室內配置。</p><button id="reset" class="reset">↺ 重設所有設定</button><div class="source">FBX 原始幾何 · 照片參考配色<br><span>展示材質為近似重建，非實景掃描。</span></div></aside>
<section id="viewport" aria-label="互動三維空間"><canvas id="scene" aria-label="3D 模型：拖曳旋轉，滾輪縮放"></canvas><div class="canvas-top"><span id="status">正在載入模型…</span><button id="fullscreen" title="全螢幕">⛶</button></div><div id="loading"><span class="spinner"></span><p>正在展開空間</p><small id="progress">讀取本地模型</small></div><div id="selection" hidden><small>已選取物件</small><strong id="objectName"></strong><span id="objectSize"></span><button id="focus">聚焦物件</button><button id="clear">取消選取</button></div><div class="axis">Y ↑ <span>↙ X　 Z ↘</span></div><div class="controls-help">左鍵旋轉 <b>·</b> 右鍵平移 <b>·</b> 滾輪縮放 <b>·</b> 點選物件</div><div class="canvas-bottom"><span id="dimensions">—</span><button id="capture">↓ 儲存畫面</button><a href="assets/model.glb" download>↓ GLB 模型</a></div></section></main>
<dialog id="gallery"><div class="dialog-head"><div><small>ON SITE / PHOTO ARCHIVE</small><h2>實體空間紀錄</h2></div><button id="closeGallery" aria-label="關閉照片">✕</button></div><div id="photoGrid"></div></dialog><script type="module" src="app.js"></script></body></html>
